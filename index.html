
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo Maroc</title>
    <link rel="stylesheet" href="/src/style.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-sky-100 via-white to-blue-100 px-4 py-10">

    <main class="max-w-2xl mx-auto">

        <header class="text-center mb-10">
            <div class="text-6xl mb-3">🌤️</div>

            <h1 class="text-4xl font-bold text-blue-900">
                Météo Maroc
            </h1>

            <p class="text-gray-500 mt-3">
                Consultez la météo de votre ville
            </p>
        </header>

        <form id="form-meteo"
            class="flex flex-col sm:flex-row gap-3 bg-white p-3 rounded-2xl shadow-lg">

            <input
                type="text"
                id="ville"
                placeholder="Entrez une ville marocaine..."
                class="flex-1 min-w-0 px-5 py-3 rounded-xl bg-gray-50 border border-gray-200 outline-none focus:border-blue-500"
            >

            <button
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl transition">
                Rechercher
            </button>

        </form>

        <p id="erreur"
            role="alert"
            class="text-red-600 text-center mt-4 font-medium hidden">
        </p>

        <div class="text-center mt-3">
            <button
                id="reessayer"
                type="button"
                class="hidden bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl">
                Réessayer
            </button>
        </div>

        <p id="chargement"
            class="hidden text-center text-blue-600 font-semibold mt-6">
            ⏳ Chargement de la météo...
        </p>

        <div id="resultat" class="mt-8 space-y-5"></div>

        <footer class="text-center text-gray-400 text-sm mt-12">
            © 2026 Météo Maroc · Open-Meteo
        </footer>

    </main>

    <script src="/js/script.js"></script>

</body>
</html>
