
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="/src/style.css">
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-blue-700 mb-6">
            Application Météo
        </h1>
        <form id="form-meteo" class="space-y-4">
            <div>
                <label for="ville" class="block font-medium text-slate-700 mb-2">
                    Ville
                </label>
                <input
                    type="text"
                    id="ville"
                    placeholder=""
                    class="w-full border border-slate-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>
            <button
                type="submit"
                class="w-full bg-blue-600 text-white font-semibold p-3 rounded-lg hover:bg-blue-700"
            >
                Rechercher
            </button>
        </form>
        <p id="erreur" class="text-red-600 text-sm mt-3 hidden"></p>
        <p id="chargement" class="text-blue-600 text-center mt-4 hidden">
            Chargement...
        </p>
        <div id="resultat" class="mt-4 text-center text-slate-700"></div>
    </main>
    <script src="/js/script.js"></script>
</body>
</html>
