
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo Maroc</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body class="min-h-screen bg-slate-100 p-5">
    <main class="max-w-3xl mx-auto mt-10">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-blue-900"> Météo Maroc</h1>
            <p class="text-gray-500 mt-2">Découvrez la météo de votre ville</p>
        </header>
        <form id="form-meteo" class="flex gap-2 bg-white p-4 rounded-2xl shadow">
            <input id="ville" type="text" placeholder="Entrez une ville..." class="flex-1 min-w-0 p-3 border rounded-xl outline-blue-500">
            <button class="bg-blue-600 text-white px-5 rounded-xl hover:bg-blue-700">Rechercher</button>
        </form>
        <p id="erreur" class="hidden text-red-600 text-center mt-4"></p>
        <div class="text-center mt-3"><button id="reessayer" type="button" class="hidden bg-orange-500 text-white px-5 py-2 rounded-xl">Réessayer</button></div>
        <p id="chargement" class="hidden text-center text-blue-600 mt-5">Chargement...</p>
        <div id="resultat" class="mt-8 space-y-5"></div>
        <footer class="text-center text-gray-400 mt-10">© 2026 Météo Maroc · Open-Meteo</footer>
    </main>
    <script src="/js/script.js"></script>
</body>
</html>
